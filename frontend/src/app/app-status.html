<div class="workspace">
  <header class="topbar">
    <a class="wordmark" href="/">Household finances</a>
    <span class="environment">Local development</span>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="system-line">
    <div class="api-status" role="status" aria-live="polite">
      <span class="status-indicator" [attr.data-state]="apiStatus()"></span>
      @switch (apiStatus()) {
        @case ('online') { <span>API connected</span> }
        @case ('offline') { <span>API unavailable</span> }
        @default { <span>Checking API</span> }
      }
    </div>
    <span>Angular frontend</span>
    <span>FastAPI service</span>
    <span>PostgreSQL storage</span>
  </footer>
</div>
